<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HackMaster Companion</title>
  <base href="/" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#5a1f1b" />
  <script>
    // Modo normal o noche (F007, specs/005-estilo-fantasia/contracts/theme.md). Va antes de la hoja
    // de estilos para que la página no se pinte un instante en el otro modo.
    (function () {
      var key = 'hackmaster.theme';
      var bar = { light: '#5a1f1b', dark: '#120d09' };
      function saved() {
        try {
          var value = JSON.parse(localStorage.getItem(key));
          return value && value.schemaVersion === 1 && bar.hasOwnProperty(value.mode) ? value.mode : null;
        } catch (e) {
          return null;
        }
      }
      function apply(mode) {
        document.documentElement.setAttribute('data-theme', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bar[mode]);
      }
      var device = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      apply(saved() || device);
      window.hackmasterTheme = {
        current: function () {
          return document.documentElement.getAttribute('data-theme');
        },
        set: function (mode) {
          if (!bar.hasOwnProperty(mode)) return;
          apply(mode);
          try {
            localStorage.setItem(key, JSON.stringify({ schemaVersion: 1, mode: mode }));
          } catch (e) {
            // Sin almacenamiento el modo cambia igual; solo no se recuerda.
          }
        }
      };
    })();
  </script>
  <link rel="preload" id="webassembly" />
  <link rel="preload" href="fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <!-- Aplicación instalable (F013, specs/011-instalable-sin-conexion). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-title" content="HackMaster" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script type="importmap"></script>
</head>

<body>
  <div id="app">
    <svg class="loading-progress">
      <circle r="40%" cx="50%" cy="50%" />
      <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
  </div>

  <div id="blazor-error-ui">
    Se ha producido un error inesperado.
    <a href="." class="reload">Recargar</a>
    <span class="dismiss">🗙</span>
  </div>
  <!-- Sin conexión, versiones nuevas e instalar (F013, contracts/pwa.md); antes de Blazor para no
       perder el aviso de instalar del navegador. -->
  <script src="js/pwa.js"></script>
  <!-- Inicio de sesión (F006); sin configuración en appsettings.json no hace nada. -->
  <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
