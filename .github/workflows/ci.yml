name: CI

# Verifica cada cambio propuesto: construcción sin avisos, pruebas, formato y publicación de prueba.
# pages.yml lo reutiliza antes de publicar, así que también se ejecuta en cada cambio de main.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Construir, probar y comprobar formato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Emulador de Cosmos DB para los tests de integración de la API (F006, tests/README.md).
    services:
      cosmos:
        # vnext-preview fijado por su resumen (2026-11-24).
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:c274ac17c19a5f74dbadbc99f259bc49a8640a03f6789f54d7f76cbfc33ff6b6
        ports:
          - 8081:8081
    env:
      COSMOS_EMULATOR_ENDPOINT: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar el SDK de .NET fijado en global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Construir sin avisos
        run: dotnet build -warnaserror --no-restore

      - name: Esperar al emulador de Cosmos DB
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "El emulador de Cosmos DB no arrancó."
          exit 1

      - name: Probar
        run: dotnet test --no-build

      - name: Comprobar formato
        run: dotnet format --verify-no-changes --no-restore

      - name: Comprobar que la aplicación se puede publicar
        run: dotnet publish src/HackMaster.Web -c Release -o publish

  infra:
    name: Comprobar la infraestructura (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Solo compila: el despliegue lo hace azure.yml en main, con la cuenta de Azure.
      - name: Compilar los archivos Bicep
        run: |
          az bicep install
          az bicep build --file infra/budget.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null

  e2e:
    name: Pruebas de navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar el SDK de .NET fijado en global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Construir
        run: dotnet build -warnaserror

      - name: Instalar Chromium para Playwright
        run: pwsh tests/HackMaster.Web.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Se usa el servidor de desarrollo, como en local (tests/README.md): resuelve las direcciones
      # profundas al recargar (/habilidades/{slug}), que un servidor de archivos simple no resuelve.
      - name: Arrancar la aplicación
        run: |
          dotnet run --no-build --project src/HackMaster.Web --launch-profile http > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5238/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Ejecutar las pruebas de navegador
        env:
          HACKMASTER_E2E_URL: http://localhost:5238/
        run: dotnet test tests/HackMaster.Web.Tests --no-build --filter "Category=E2E"

  published:
    name: Pruebas del sitio publicado (sin conexión)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar el SDK de .NET fijado en global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Construir
        run: dotnet build -warnaserror

      - name: Instalar Chromium para Playwright
        run: pwsh tests/HackMaster.Web.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # F013: la aplicación como se publica en GitHub Pages, con su ruta base y su trabajador de
      # servicio (specs/011-instalable-sin-conexion/quickstart.md).
      - name: Publicar con la ruta base
        run: |
          dotnet publish src/HackMaster.Web -c Release -o publish
          bash tools/pages/apply-base-path.sh publish/wwwroot /HackMasterCompanion/

      - name: Ejecutar las pruebas del sitio publicado
        env:
          HACKMASTER_PUBLISHED_DIR: ${{ github.workspace }}/publish/wwwroot
        run: dotnet test tests/HackMaster.Web.Tests --no-build --filter "Category=Published"
